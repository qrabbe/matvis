name: CI + Deploy

# One pipeline. On pull requests it only verifies (format · typecheck · build ·
# test · secret scan). On a push to main, the same checks run first and the
# deploy job runs ONLY if every check passes, so a broken build, a failing
# test, a formatting slip, or a leaked secret blocks the Convex + statichost
# release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in this pipeline writes back to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: format · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck # tsc -b: typechecks + builds every package
      - run: bun run test # bun unit tests + the connector's convex-test (vitest)

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  deploy:
    name: Convex prod + statichost
    # Gate: only after every check is green, and only for a real push to main
    # (never on pull_request runs, which can come from forks).
    needs: [verify, secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # `convex deploy` (authenticated by CONVEX_DEPLOY_KEY, which selects the
      # production deployment) ships the backend. The two portals have separate
      # Convex projects and separate deploy keys. The frontends are not built
      # here, statichost.eu builds them from this repo (see statichost.yml).
      - name: Deploy connector Convex (prod)
        working-directory: packages/connector
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy

      - name: Deploy catalog Convex (prod)
        working-directory: packages/catalog
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_CATALOG }}
        run: bunx convex deploy

      # statichost.eu builds the site itself. Its build is triggered from here
      # rather than from a raw push webhook on the repository, so it only starts
      # after every check went green and after the Convex backends the portals
      # talk to are already live.
      - name: Trigger statichost.eu build
        run: curl -fsS -X POST https://builder.statichost.eu/matvis
